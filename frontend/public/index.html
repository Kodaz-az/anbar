<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Okul İçi İlan Platformu</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <header>
      <div class="container navbar">
        <a class="navbar-brand" href="index.html">Kampüs Pazarı</a>
        <nav class="navbar-links">
          <a href="index.html">Anasayfa</a>
          <a href="submit-listing.html" data-auth>İlan Ver</a>
          <a href="my-listings.html" data-auth>İlanlarım</a>
          <a href="admin-dashboard.html" data-role="admin">Admin Paneli</a>
          <a href="login.html" data-guest>Giriş Yap</a>
          <a href="register.html" data-guest>Kayıt Ol</a>
          <button data-logout class="hidden" data-auth>Çıkış Yap</button>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <h1>Kampüste ihtiyaç fazlası eşyalar yeni sahiplerini bulsun.</h1>
        <p>
          Öğrencilerin kendi aralarında güvenle eşyalarını paylaştığı, yönetici onaylı okul içi ilan platformu.
        </p>
        <div>
          <a class="button" href="submit-listing.html" data-auth>İlan Oluştur</a>
          <a class="button secondary" href="register.html" data-guest>Hemen Katıl</a>
        </div>
      </section>

      <section class="container">
        <form id="search-form" class="form">
          <div class="form-group">
            <label for="search">Anahtar Kelime</label>
            <input type="search" id="search" name="search" placeholder="Ürün adı veya açıklama" />
          </div>
          <div class="form-group">
            <label for="category">Kategori</label>
            <input type="text" id="category" name="category" placeholder="Örn: Elektronik" />
          </div>
          <button type="submit" class="button">Filtrele</button>
        </form>
      </section>

      <section class="container">
        <div class="grid grid-cols-3" data-listings></div>
      </section>
    </main>

    <script type="module" src="js/listings.js"></script>
  </body>
</html>
