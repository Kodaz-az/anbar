<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kayıt Ol - Kampüs Pazarı</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <header>
      <div class="container navbar">
        <a class="navbar-brand" href="index.html">Kampüs Pazarı</a>
        <nav class="navbar-links">
          <a href="index.html">Anasayfa</a>
          <a href="submit-listing.html" data-auth>İlan Ver</a>
          <a href="my-listings.html" data-auth>İlanlarım</a>
          <a href="admin-dashboard.html" data-role="admin">Admin Paneli</a>
          <a href="login.html" data-guest>Giriş Yap</a>
          <a href="register.html" data-guest>Kayıt Ol</a>
          <button data-logout class="hidden" data-auth>Çıkış Yap</button>
        </nav>
      </div>
    </header>

    <main>
      <section class="container">
        <h1>Okul hesabınız ile kayıt olun</h1>
        <p>İlan oluşturabilmek için gerekli bilgileri doldurun.</p>
        <div class="alert hidden" data-alert></div>
        <form id="register-form" class="form">
          <div class="form-group">
            <label for="firstName">Ad</label>
            <input type="text" id="firstName" name="firstName" required />
          </div>
          <div class="form-group">
            <label for="lastName">Soyad</label>
            <input type="text" id="lastName" name="lastName" required />
          </div>
          <div class="form-group">
            <label for="schoolNumber">Okul Numarası</label>
            <input type="text" id="schoolNumber" name="schoolNumber" required />
          </div>
          <div class="form-group">
            <label for="email">E-posta</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="password">Şifre</label>
            <input type="password" id="password" name="password" minlength="8" required />
          </div>
          <button type="submit" class="button">Kayıt Ol</button>
        </form>
      </section>
    </main>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
